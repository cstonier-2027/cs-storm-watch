# Rebuilds the weather data every 30 minutes and deploys CS's Storm Watch to Cloudflare.
name: Refresh map

on:
  schedule:
    - cron: "2,32 * * * *"
  workflow_dispatch:

concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: wxmap/requirements.txt

      - name: Install Python packages
        run: pip install -q -r wxmap/requirements.txt

      - name: Build weather data
        working-directory: wxmap
        run: |
          python -W ignore build.py | tee build.log
          tail -1 build.log | grep -q '^done'

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: deploy/package-lock.json

      - name: Deploy to Cloudflare
        working-directory: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npm ci --silent
          ./deploy.sh

      # GitHub pauses scheduled workflows after 60 days without commits; nudge it monthly.
      - name: Keep schedule alive
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep scheduled refresh active"
            git push
          fi
